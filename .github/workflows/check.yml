name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 语法检查
        run: node --check main.js
      - name: 冒烟测试
        run: node test/harness.js
      - name: manifest 校验
        run: node tools/check-manifest.js
      - name: 构建可复现（模板 + 内联页面重建 main.js）
        run: node tools/rebuild.js
